<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#feb2d9">
<link rel="apple-touch-icon" href="/kid-games/icon-animals.png">
<title>Animal Noises 🐶</title>
<!--
  Animal Noises — a first game for a 1-year-old: ANY tap, anywhere,
  shows a new animal picture and plays that animal's real sound.

  Sound recordings: Wikimedia Commons (freely licensed):
  dog "Barking of a dog", cat "Meow of a Siamese cat", cow "Single Cow Moo",
  pig "Pig grunt - Erdie" + "Mudchute pig 1", sheep "Mudchute sheep 1",
  duck "Mudchute duck 2", horse whinnies (Segregation of information about
  emotional arousal and valence in horse whinnies, srep09989 s2),
  lion "Lion raring-sound1TamilNadu178", elephant "Elephant voice - trumpeting",
  frog "Single Frog Croak", chicken "Chickens demanding food",
  monkey "Brown woolly monkey alarm call". Trimmed + normalized with ffmpeg.
  Animal pictures are AI-generated cartoon illustrations.
-->
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overscroll-behavior:none; }
  body {
    font-family: ui-rounded, -apple-system, "Segoe UI", Roboto, sans-serif;
    height:100dvh; overflow:hidden; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
    touch-action:none; transition: background-color .45s ease;
    padding: max(14px, env(safe-area-inset-top)) 14px max(10px, env(safe-area-inset-bottom));
  }
  #tapHint {
    font-size: clamp(22px, 5.5vw, 34px); font-weight:900; color:#fff;
    text-shadow:0 2px 0 rgba(0,0,0,.15), 0 4px 14px rgba(0,0,0,.15);
    animation: pulse 1.1s ease-in-out infinite; margin-bottom: 10px; min-height: 1.3em;
  }
  #tapHint.gone { visibility:hidden; animation:none; }
  @keyframes pulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.09); } }
  #card {
    background:#fff; border-radius: clamp(20px, 5vmin, 36px);
    padding: clamp(8px, 1.8vmin, 16px);
    box-shadow: 0 14px 40px rgba(60,20,90,.28);
    max-width: min(92vw, 92dvh);
  }
  #pic {
    display:block; border-radius: clamp(14px, 3.6vmin, 26px);
    width: min(84vw, 62dvh); height: min(84vw, 62dvh); object-fit: cover;
    pointer-events:none;
  }
  #name {
    margin-top: 14px; font-size: clamp(44px, 11vw, 84px); font-weight:900; line-height:1.05;
    color:#fff; text-shadow:0 3px 0 rgba(0,0,0,.16), 0 6px 18px rgba(0,0,0,.18);
    letter-spacing:.5px; text-align:center;
  }
  #word {
    margin-top: 8px; font-size: clamp(28px, 7vw, 50px); font-weight:900;
    color:#5b2a86; background:#fff; border-radius:999px; padding: 6px 30px 10px;
    box-shadow:0 5px 0 rgba(60,20,90,.25); text-align:center;
  }
  #credit {
    position:fixed; left:0; right:0; bottom:4px; text-align:center;
    font-size:11px; font-weight:600; color:rgba(255,255,255,.85);
    text-shadow:0 1px 3px rgba(0,0,0,.25); pointer-events:none;
  }
  .spark { position:fixed; z-index:5; pointer-events:none; will-change: transform, opacity; }
</style>
</head>
<body>
  <div id="tapHint">Tap anywhere! 👆</div>
  <div id="card"><img id="pic" alt="animal"></div>
  <div id="name">…</div>
  <div id="word">…</div>
  <div id="credit">Animal sounds: Wikimedia Commons</div>

<script>
(function(){
"use strict";
function $(id){ return document.getElementById(id); }

var ANIMALS = [
  { id:"dog", name:"Dog", word:"Woof woof!", color:"#fee97e" },
  { id:"cat", name:"Cat", word:"Meow!", color:"#feb2d9" },
  { id:"cow", name:"Cow", word:"Moo!", color:"#afe493" },
  { id:"pig", name:"Pig", word:"Oink oink!", color:"#ffbfa3" },
  { id:"sheep", name:"Sheep", word:"Baa!", color:"#daadfd" },
  { id:"duck", name:"Duck", word:"Quack quack!", color:"#91dafb" },
  { id:"horse", name:"Horse", word:"Neigh!", color:"#b9f3da" },
  { id:"lion", name:"Lion", word:"Roar!", color:"#fdaa66" },
  { id:"elephant", name:"Elephant", word:"Toot toot!", color:"#c1cfda" },
  { id:"frog", name:"Frog", word:"Ribbit!", color:"#a7efe6" },
  { id:"chicken", name:"Chicken", word:"Cluck cluck!", color:"#fe8b7b" },
  { id:"monkey", name:"Monkey", word:"Ooh ooh ah ah!", color:"#d4f07b" }
];
var EMOJI = { dog:"🐶", cat:"🐱", cow:"🐮", pig:"🐷", sheep:"🐑", duck:"🦆",
              horse:"🐴", lion:"🦁", elephant:"🐘", frog:"🐸", chicken:"🐔", monkey:"🐵" };

/* preload pictures + sounds */
var audios = {}, i;
for (i=0;i<ANIMALS.length;i++){
  var im = new Image(); im.src = 'assets/img/'+ANIMALS[i].id+'.jpg';
  var au = new Audio(); au.preload='auto'; au.src='assets/snd/'+ANIMALS[i].id+'.mp3';
  audios[ANIMALS[i].id]=au;
}

/* shuffle-bag so every animal shows before any repeats */
var bag=[], lastId=null;
function refill(){
  bag = ANIMALS.slice();
  for (var j=bag.length-1;j>0;j--){ var k=(Math.random()*(j+1))|0, t=bag[j]; bag[j]=bag[k]; bag[k]=t; }
  if (bag[0].id===lastId) { var t2=bag[0]; bag[0]=bag[1]; bag[1]=t2; }
}
function nextAnimal(){
  if (!bag.length) refill();
  var a = bag.shift(); lastId=a.id; return a;
}

var pic=$('pic'), nameEl=$('name'), wordEl=$('word'), card=$('card'), hint=$('tapHint');
var current=null, started=false, lastSwitch=0;

function show(a, playSound){
  current=a;
  document.body.style.backgroundColor=a.color;
  pic.src='assets/img/'+a.id+'.jpg';
  pic.alt=a.name;
  nameEl.textContent=a.name;
  wordEl.textContent=a.word;
  card.style.transform='rotate('+((Math.random()*4)-2).toFixed(1)+'deg)';
  /* big happy bounce */
  card.animate([
    { transform: card.style.transform+' scale(0.82)' },
    { transform: card.style.transform+' scale(1.06)', offset:0.55 },
    { transform: card.style.transform+' scale(1)' }
  ], { duration:380, easing:'cubic-bezier(.2,1.6,.4,1)' });
  if (playSound){
    var au=audios[a.id];
    try { au.pause(); au.currentTime=0; var p=au.play(); if(p&&p.catch) p.catch(function(){}); } catch(e){}
  }
  burst();
}

/* a few emoji sparkles fly out on every tap */
var SPARKS=['⭐','💖','✨','🌟','💛'];
function burst(){
  for (var s=0;s<6;s++){
    var el=document.createElement('div');
    el.className='spark';
    el.textContent=SPARKS[(Math.random()*SPARKS.length)|0];
    el.style.left=(12+Math.random()*76)+'vw';
    el.style.top=(18+Math.random()*55)+'dvh';
    el.style.fontSize=(22+Math.random()*26)+'px';
    document.body.appendChild(el);
    var dx=(Math.random()*120-60), dy=-(60+Math.random()*110);
    el.animate([
      { transform:'translate(0,0) scale(.5) rotate(0deg)', opacity:1 },
      { transform:'translate('+dx+'px,'+dy+'px) scale(1.25) rotate('+(Math.random()*160-80)+'deg)', opacity:0 }
    ], { duration:750+Math.random()*350, easing:'cubic-bezier(.2,.8,.4,1)' })
    .onfinish=(function(node){ return function(){ node.remove(); }; })(el);
  }
}

/* THE rule of this game: no matter what she presses, an animal appears
   with its sound. The whole screen is the button. */
function press(){
  var now=performance.now();
  if (now-lastSwitch<300) return;   /* mash-proofing: quarter-second max rate */
  lastSwitch=now;
  if (!started){ started=true; hint.classList.add('gone'); }
  show(nextAnimal(), true);
}
document.addEventListener('pointerdown', function(e){ e.preventDefault(); press(); });
document.addEventListener('keydown', function(){ press(); });
document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
document.addEventListener('dblclick', function(e){ e.preventDefault(); });

/* first animal is already on screen, quietly, waiting for a tap */
show(nextAnimal(), false);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('/kid-games/sw.js', { scope: '/kid-games/' });
  });
}
})();
</script>
</body>
</html>
