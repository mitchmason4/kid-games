<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f9a8d4">
<link rel="apple-touch-icon" href="/kid-games/icon-dressup.png">
<title>Emi's Dress-Up! 👗</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%; overflow: hidden; overscroll-behavior: none;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: linear-gradient(160deg, #ffe3f1 0%, #f3e8ff 55%, #e3f2ff 100%);
    user-select: none; -webkit-user-select: none; touch-action: manipulation;
  }
  #app { max-width: 480px; height: 100%; margin: 0 auto; display: flex; flex-direction: column; padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); }
  header { display: flex; align-items: center; justify-content: space-between; padding: 4px 2px 8px; }
  .title { font-size: 30px; font-weight: 900; color: #9d4edd; text-shadow: 0 2px 0 #fff; }
  #dadaBtn {
    font-size: 17px; font-weight: 800; color: #fff; background: linear-gradient(180deg, #ff9ec7, #f27bab);
    border: none; border-radius: 999px; padding: 10px 16px; cursor: pointer;
    box-shadow: 0 3px 0 #d1567f, 0 6px 12px rgba(242,123,171,.35);
  }
  #dadaBtn:active { transform: translateY(2px); box-shadow: 0 1px 0 #d1567f; }
  #stage {
    position: relative; flex: 1; min-height: 0; background: rgba(255,255,255,.55);
    border-radius: 26px; box-shadow: inset 0 2px 12px rgba(157,78,221,.12), 0 4px 14px rgba(157,78,221,.10);
    overflow: hidden; margin-bottom: 10px;
  }
  #sparkle { position: absolute; inset: 0; pointer-events: none; }
  #character { position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%); height: calc(100% - 12px); aspect-ratio: 750 / 1520; }
  #character svg.layer { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #charimg { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 10px; }
  #svgDress { z-index: 1; } #svgShoe { z-index: 2; } #svgJewel { z-index: 3; }
  #svgHair { z-index: 4; } #svgHat { z-index: 5; }
  #companion {
    position: absolute; z-index: 6; right: 14px; bottom: 8px; font-size: 62px; line-height: 1;
    filter: drop-shadow(0 4px 4px rgba(0,0,0,.15)); animation: bob 2.6s ease-in-out infinite;
  }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  #menu { background: rgba(255,255,255,.75); border-radius: 22px; padding: 10px 10px 12px; box-shadow: 0 4px 14px rgba(157,78,221,.12); }
  #tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
  #tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: 0 0 auto; font-size: 15px; font-weight: 800; color: #9d4edd; background: #f3e8ff;
    border: 2px solid transparent; border-radius: 999px; padding: 8px 13px; cursor: pointer; white-space: nowrap;
  }
  .tab.on { background: #fff; border-color: #c084fc; box-shadow: 0 2px 6px rgba(157,78,221,.25); }
  #options { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 4px; scrollbar-width: none; min-height: 66px; }
  #options::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-width: 64px; padding: 8px 10px; background: #fff; border: 2px solid #eee; border-radius: 16px;
    cursor: pointer; font-size: 13px; font-weight: 700; color: #5b5b5b;
  }
  .chip .big { font-size: 30px; line-height: 1.1; }
  .chip .dot { width: 26px; height: 26px; border-radius: 50%; margin-bottom: 4px; box-shadow: inset 0 0 0 2px rgba(255,255,255,.5), 0 1px 3px rgba(0,0,0,.15); }
  .chip.on { border-color: #f27bab; background: #fff5f8; box-shadow: 0 2px 8px rgba(242,123,171,.35); }
  .chip:active { transform: scale(.94); }
  #reward {
    position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center;
    background: rgba(80,30,90,.55); backdrop-filter: blur(3px); cursor: pointer; padding: 24px;
  }
  #reward.hidden { display: none; }
  .reward-card { text-align: center; animation: pop-in .35s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop-in { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .reward-card img {
    width: min(72vw, 300px); height: min(72vw, 300px); object-fit: cover; border-radius: 50%;
    border: 6px solid #fff; box-shadow: 0 10px 40px rgba(0,0,0,.35);
  }
  .reward-text { font-size: 40px; font-weight: 900; color: #fff; margin-top: 14px; text-shadow: 0 3px 10px rgba(0,0,0,.4); }
  .reward-tap { font-size: 20px; color: #fff; margin-top: 10px; opacity: .9; }
  canvas.fx { position: fixed; inset: 0; z-index: 60; pointer-events: none; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="title">Emi's Dress-Up! 👗</div>
    <button id="dadaBtn">💕 Show Dada</button>
  </header>
  <div id="stage">
    <svg id="sparkle" viewBox="0 0 400 400" preserveAspectRatio="none"></svg>
    <div id="character">
      <img id="charimg" alt="Emi">
      <svg class="layer" id="svgDress" viewBox="0 0 750 1520" preserveAspectRatio="none"></svg>
      <svg class="layer" id="svgShoe" viewBox="0 0 750 1520" preserveAspectRatio="none"></svg>
      <svg class="layer" id="svgJewel" viewBox="0 0 750 1520" preserveAspectRatio="none"></svg>
      <svg class="layer" id="svgHair" viewBox="0 0 750 1520" preserveAspectRatio="none"></svg>
      <svg class="layer" id="svgHat" viewBox="0 0 750 1520" preserveAspectRatio="none"></svg>
    </div>
    <div id="companion"></div>
  </div>
  <div id="menu">
    <div id="tabs"></div>
    <div id="options"></div>
  </div>
</div>

      + '<circle cx="640" cy="565" r="86" fill="'+c+'" stroke="'+d+'" stroke-width="6"/>'
      + '<circle cx="110" cy="565" r="30" fill="'+d+'" opacity="0.5"/>'
      + '<circle cx="640" cy="565" r="30" fill="'+d+'" opacity="0.5"/>'
      + '<rect x="91" y="473" width="38" height="24" rx="12" fill="#ff6b9d" transform="rotate(24 110 485)"/>'
      + '<rect x="621" y="473" width="38" height="24" rx="12" fill="#ff6b9d" transform="rotate(-24 640 485)"/>';
  }
  return cap
    + '<circle cx="380" cy="98" r="72" fill="'+c+'" stroke="'+d+'" stroke-width="6"/>'
    + '<path d="M330,72 q50,-28 100,0" stroke="'+d+'" stroke-width="6" fill="none" stroke-linecap="round"/>';
}
function dressSVG(i){
  var D = DRESSES[i], s = '';
  var defs = '<defs><linearGradient id="rainbow" x1="0" y1="0" x2="0" y2="1">'
    + '<stop offset="0" stop-color="#ff8f8f"/><stop offset=".2" stop-color="#ffb38a"/>'
    + '<stop offset=".4" stop-color="#ffdf6b"/><stop offset=".6" stop-color="#93e6a8"/>'
    + '<stop offset=".8" stop-color="#8ed1ff"/><stop offset="1" stop-color="#c3a6ff"/>'
    + '</linearGradient></defs>';
  var fill = (D.s==='rainbow' || D.c.indexOf('url')===0) ? 'url(#rainbow)' : D.c;
  var hemW = D.s==='princess' ? 250 : D.s==='tutu' ? 190 : 210;
  var hemY = 1200, hx1 = 345-hemW, hx2 = 345+hemW;
  var skirt = 'M208,630 L282,640 Q345,690 408,640 L482,630 L468,880 '
    + 'C510,955 528,1080 '+hx2+','+hemY+' Q345,'+(hemY+36)+' '+hx1+','+hemY+' '
    + 'C162,1080 180,955 222,880 Z';
  s = defs + '<path d="'+skirt+'" fill="'+fill+'" stroke="rgba(0,0,0,0.14)" stroke-width="4" stroke-linejoin="round"/>';
  if(D.s==='tutu'){
    s += '<path d="'+skirt+'" fill="'+fill+'" opacity="0.55" transform="translate(0,-40)"/>'
       + '<path d="'+skirt+'" fill="'+fill+'" opacity="0.35" transform="translate(0,-80)"/>';
  }
  if(D.s==='sun'){
    s += '<rect x="296" y="596" width="28" height="52" rx="10" fill="'+D.d+'"/>'
       + '<rect x="366" y="596" width="28" height="52" rx="10" fill="'+D.d+'"/>';
  }
  s += '<circle cx="215" cy="655" r="30" fill="'+D.d+'" stroke="rgba(0,0,0,0.12)" stroke-width="4"/>'
     + '<circle cx="475" cy="655" r="30" fill="'+D.d+'" stroke="rgba(0,0,0,0.12)" stroke-width="4"/>';
  s += '<rect x="222" y="860" width="246" height="32" rx="16" fill="'+D.d+'" opacity="0.92"/>'
     + '<circle cx="345" cy="876" r="14" fill="'+D.d+'" stroke="rgba(0,0,0,0.12)" stroke-width="3"/>';
  if(D.n==='Bubblegum'){
    var dots = [[300,770],[390,770],[345,845],[300,920],[390,920],[345,995],[300,1070],[390,1070],[345,1140]];
    for(var dI=0; dI<dots.length; dI++) s += '<circle cx="'+dots[dI][0]+'" cy="'+dots[dI][1]+'" r="12" fill="#fff" opacity="0.8"/>';
  } else if(D.n==='Princess'){
    var sp = [[300,950],[390,1000],[345,1080],[310,1130],[380,1130]];
    for(var sI=0; sI<sp.length; sI++) s += '<circle cx="'+sp[sI][0]+'" cy="'+sp[sI][1]+'" r="7" fill="#fff" opacity="0.9"/>';
  } else if(D.n==='Mint'){
    for(var lI=0; lI<12; lI++) s += '<circle cx="'+(140+lI*38)+'" cy="1192" r="14" fill="#fff" opacity="0.85"/>';
  } else if(D.n==='Sunny'){
    var dz = [[300,800],[390,860],[345,950],[305,1040],[385,1100],[345,1150]];
    for(var zI=0; zI<dz.length; zI++)
      s += '<circle cx="'+dz[zI][0]+'" cy="'+dz[zI][1]+'" r="11" fill="#fff" opacity="0.92"/>'
         + '<circle cx="'+dz[zI][0]+'" cy="'+dz[zI][1]+'" r="5" fill="#ff9d00"/>';
  }
  s += '<circle cx="345" cy="730" r="5" fill="'+D.d+'"/><circle cx="345" cy="752" r="5" fill="'+D.d+'"/>';
  return s;
}
function shoesSVG(i){
  var c = SHOES[i].c;
  return '<ellipse cx="419" cy="1458" rx="54" ry="32" fill="'+c+'" stroke="rgba(0,0,0,0.15)" stroke-width="4"/>'
       + '<ellipse cx="237" cy="1474" rx="54" ry="32" fill="'+c+'" stroke="rgba(0,0,0,0.15)" stroke-width="4"/>';
}
function jewelSVG(i){
  if(i===0) return '';
  if(i===1) return '<path d="M290,640 Q348,700 406,640" stroke="#f0c23e" stroke-width="10" fill="none" stroke-linecap="round"/>'
    + '<circle cx="348" cy="712" r="15" fill="#ff5b7f" stroke="#d14a68" stroke-width="4"/>'
    + '<circle cx="343" cy="707" r="4" fill="#ffc9d6"/>';
  if(i===2){
    var s = '<path d="M290,640 Q348,700 406,640" stroke="#ffffff" stroke-width="9" fill="none" stroke-linecap="round" stroke-dasharray="0.1 14"/>';
    return s + '<circle cx="348" cy="712" r="10" fill="#ffffff" stroke="#e3d5f5" stroke-width="3"/>';
  }
  return '<path d="M300,638 Q348,688 396,638" stroke="#f0c23e" stroke-width="6" fill="none"/>'
    + '<polygon points="348,700 355,716 372,716 358,726 363,743 348,733 333,743 338,726 324,716 341,716" '
    + 'fill="#ffd23e" stroke="#e8a93d" stroke-width="3" stroke-linejoin="round"/>';
}
function hatSVG(i){
  if(i===0) return '';
  return '<text x="335" y="150" font-size="118" text-anchor="middle">'+CROWN_O[i][1]+'</text>';
}
/* ---------- render ---------- */
function render(){
  $('svgHair').innerHTML = hairSVG(state.hair);
  $('svgDress').innerHTML = dressSVG(state.dress);
  $('svgShoe').innerHTML = shoesSVG(state.shoes);
  $('svgJewel').innerHTML = jewelSVG(state.jewel);
  $('svgHat').innerHTML = hatSVG(state.crown);
  $('companion').textContent = FRIEND_O[state.friend][1];
  renderTabs(); renderOptions(); save();
}
function renderTabs(){
  $('tabs').innerHTML = CATS.map(function(c){
    return '<button class="tab'+(state.cat===c.id?' on':'')+'" data-cat="'+c.id+'">'+c.label+'</button>';
  }).join('');
}
function chip(i, inner, on){
  return '<button class="chip'+(on?' on':'')+'" data-i="'+i+'">'+inner+'</button>';
}
function renderOptions(){
  var id = state.cat, h = '';
  if(id==='hair'){
    h = HAIR_N.map(function(n,i){ return chip(i, '<span>'+n+'</span>', state.hair===i); }).join('');
  } else if(id==='crown'){
    h = CROWN_O.map(function(o,i){ return chip(i, '<span class="big">'+(o[1]||'🚫')+'</span><span>'+o[0]+'</span>', state.crown===i); }).join('');
  } else if(id==='jewel'){
    h = JEWEL_N.map(function(n,i){ return chip(i, '<span>'+n+'</span>', state.jewel===i); }).join('');
  } else if(id==='dress'){
    h = DRESSES.map(function(d,i){
      var dot = d.c.indexOf('url')===0
        ? 'background:linear-gradient(90deg,#ff8f8f,#ffdf6b,#93e6a8,#8ed1ff,#c3a6ff)'
        : 'background:'+d.c;
      return chip(i, '<span class="dot" style="'+dot+'"></span><span>'+d.n+'</span>', state.dress===i);
    }).join('');
  } else if(id==='shoes'){
    h = SHOES.map(function(s,i){ return chip(i, '<span class="dot" style="background:'+s.c+'"></span><span>'+s.n+'</span>', state.shoes===i); }).join('');
  } else {
    h = FRIEND_O.map(function(o,i){ return chip(i, '<span class="big">'+(o[1]||'🚫')+'</span><span>'+o[0]+'</span>', state.friend===i); }).join('');
  }
  $('options').innerHTML = h;
}

$('tabs').addEventListener('click', function(e){
  var b = e.target.closest('[data-cat]'); if(!b) return;
  state.cat = b.getAttribute('data-cat'); pop(); renderTabs(); renderOptions();
});
$('options').addEventListener('click', function(e){
  var b = e.target.closest('[data-i]'); if(!b) return;
  var i = parseInt(b.getAttribute('data-i'), 10), id = state.cat;
  if(id==='hair') state.hair=i; else if(id==='crown') state.crown=i;
  else if(id==='jewel') state.jewel=i; else if(id==='dress') state.dress=i;
  else if(id==='shoes') state.shoes=i; else state.friend=i;
  pop(); twinkle(); render();
});

/* ---------- sparkles ---------- */
var sparkTimer = null;
function twinkle(){
  var svg = $('sparkle'), s = '';
  for(var k=0;k<6;k++){
    var x = 40+Math.random()*320, y = 40+Math.random()*200, r = 3+Math.random()*5;
    s += '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="#fff" opacity="0.95">'
       + '<animate attributeName="opacity" values="0.95;0;0.95" dur="0.9s" repeatCount="2"/>'
       + '<animate attributeName="r" values="'+r+';'+(r+4)+';'+r+'" dur="0.9s" repeatCount="2"/></circle>';
  }
  svg.innerHTML = s;
  if(sparkTimer) clearTimeout(sparkTimer);
  sparkTimer = setTimeout(function(){ svg.innerHTML=''; }, 1900);
}

/* ---------- reward ---------- */
function launchConfetti(){
  var c = document.createElement('canvas'); c.className='fx';
  c.width = innerWidth; c.height = innerHeight; document.body.appendChild(c);
  var x = c.getContext('2d');
  var cols = ['#ff9ec7','#c3a6ff','#8ed1ff','#ffdf6b','#93e6a8','#ffb38a'];
  var ps = [];
  for(var i=0;i<130;i++) ps.push({ x:Math.random()*c.width, y:-20-Math.random()*c.height*0.3,
    vx:(Math.random()-0.5)*120, vy:120+Math.random()*180, s:6+Math.random()*8,
    col:cols[i%cols.length], r:Math.random()*Math.PI, vr:(Math.random()-0.5)*8 });
  var last = performance.now();
  (function tick(now){
    var dt = Math.min((now-last)/1000, 0.05); last = now;
    x.clearRect(0,0,c.width,c.height);
    var alive = false;
    for(var j=0;j<ps.length;j++){ var p=ps[j];
      p.x+=p.vx*dt; p.y+=p.vy*dt; p.r+=p.vr*dt;
      if(p.y < c.height+30) alive = true;
      x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle=p.col;
      x.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.62); x.restore();
    }
    if(alive) requestAnimationFrame(tick); else c.remove();
  })(last);
}
var rewardEl = $('reward');
function showReward(){ rewardEl.classList.remove('hidden'); fanfare(); launchConfetti(); }
rewardEl.addEventListener('pointerdown', function(e){
  rewardEl.classList.add('hidden'); e.stopPropagation();
  if(e.cancelable) e.preventDefault();
}, { passive:false });
$('dadaBtn').addEventListener('click', function(){ pop(); showReward(); });

$('charimg').src = CHARIMG;
render();
})();
</script>

  });
