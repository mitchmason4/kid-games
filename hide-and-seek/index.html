<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#58b368">
<link rel="apple-touch-icon" href="/kid-games/icon-hide.png">
<title>Princess Hide &amp; Seek 👑</title>
<!--
  Princess Hide & Seek — a wordless hide-and-seek for a pre-reader.
  A princess waves hello, then hides behind ONE of 37 things across
  three big pictures (garden, castle, forest). Emi flips between the
  pictures with the thumbnail bar and taps things to find her.
  8 other spots hide surprise animal friends (from Animal Noises):
  they pop out with their real sound and stay as a little badge, but
  only the princess wins. Tapped empty spots get a faint star so she
  can keep track. Every third miss, a hint sparkles: the hiding place
  itself, or the picture tab she is hiding in.
  No words anywhere except the "Good Job Emi! Dada" reward.
  All pictures are AI-generated cartoon illustrations.
-->
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overscroll-behavior:none; }
  body {
    font-family: ui-rounded, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(180deg, #cfe8ff 0%, #e3ffd9 50%, #ffe9f6 100%);
    display:flex; flex-direction:column; height:100dvh; overflow:hidden;
    user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
    color:#5b2a86; touch-action:manipulation;
  }
  header {
    display:flex; align-items:center; gap:10px;
    padding: max(10px, env(safe-area-inset-top)) 14px 6px;
  }
  /* Who to find: her face in a gold-ringed bubble, with a magnifier badge. */
  #findBubble {
    position:relative; width:58px; height:58px; flex:0 0 auto;
    border-radius:50%; border:4px solid #ffd94d; overflow:visible;
    box-shadow:0 3px 0 rgba(200,150,0,.35), 0 6px 14px rgba(91,42,134,.15);
    background:#fff;
  }
  #findBubble img { width:100%; height:100%; object-fit:cover; border-radius:50%; display:block; }
  #findBubble .badge {
    position:absolute; right:-7px; bottom:-7px; width:26px; height:26px; border-radius:50%;
    background:#ffd94d; border:3px solid #fff; display:flex; align-items:center; justify-content:center;
    font-size:14px; box-shadow:0 2px 5px rgba(0,0,0,.2);
  }
  body.seeking #findBubble { animation:bubblePulse 1.6s ease-in-out infinite; }
  @keyframes bubblePulse {
    0%, 100% { box-shadow:0 3px 0 rgba(200,150,0,.35), 0 0 0 0 rgba(255,217,77,.75); }
    50% { box-shadow:0 3px 0 rgba(200,150,0,.35), 0 0 0 7px rgba(255,217,77,0); }
  }
  #foundPill {
    display:flex; align-items:center; gap:7px; margin-right:auto;
    font-weight:900; font-size:clamp(17px, 4vw, 21px); color:#8a5a00;
    background:#fff7d6; border-radius:999px; padding:8px 15px;
    box-shadow:0 3px 0 rgba(200,150,0,.35);
  }
  .iconBtn {
    border:none; cursor:pointer; width:52px; height:52px; flex:0 0 auto;
    background:#fff; border-radius:50%; display:flex; align-items:center; justify-content:center;
    box-shadow:0 3px 0 rgba(124,58,237,.35), 0 6px 14px rgba(91,42,134,.12);
  }
  .iconBtn:active { transform:translateY(2px); box-shadow:0 1px 0 rgba(124,58,237,.35); }
  .iconBtn svg { width:30px; height:30px; }
  /* Stage: the big picture, fitted to the screen by JS. */
  #stage { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; padding:0 6px 4px; }
  #sceneWrap { position:relative; border-radius:22px; overflow:hidden; border:4px solid #fff;
    box-shadow:0 8px 24px rgba(91,42,134,.25); background:#bfe3ff; }
  #sceneWrap img.scene { width:100%; height:100%; display:block; pointer-events:none; }
  /* Tappable hiding places: invisible buttons over the picture.
     Spots later in a scene's list paint above earlier ones, so small
     spots sitting on big ones (birdhouse on the oak) win the tap. */
  .spot {
    position:absolute; border:none; background:transparent; cursor:pointer; padding:0;
    border-radius:24px; z-index:2;
  }
  .spot::after {
    content:''; position:absolute; inset:6%; border-radius:50%;
    border:5px dashed rgba(160,107,255,0); pointer-events:none;
  }
  .spot.miss { animation:missFlash .55s ease-out; }
  @keyframes missFlash {
    0% { background:rgba(255,255,255,.45); }
    100% { background:rgba(255,255,255,0); }
  }
  .spot.miss::after { animation:missRing .55s ease-out; }
  @keyframes missRing {
    0% { border-color:rgba(160,107,255,.95); transform:scale(.55); opacity:1; }
    100% { border-color:rgba(160,107,255,0); transform:scale(1.1); opacity:0; }
  }
  /* Faint star on a checked empty spot, so she can keep track. */
  .spot.checked::before {
    content:'★'; position:absolute; left:50%; top:50%; z-index:3;
    font-size:26px; line-height:1; color:#ffd94d; opacity:.95;
    text-shadow:0 1px 0 #b8860b, 0 2px 6px rgba(0,0,0,.4); pointer-events:none;
    transform:translate(-50%,-50%);
  }
  /* Hint sparkle on the hiding place (overrides the checked star). */
  .spot.hint::before {
    content:'✨'; font-size:46px; color:inherit; text-shadow:none; opacity:1;
    animation:hintPulse .6s ease-in-out infinite;
  }
  @keyframes hintPulse {
    0%, 100% { opacity:.35; transform:translate(-50%,-50%) scale(.8); }
    50% { opacity:1; transform:translate(-50%,-50%) scale(1.15); }
  }
  /* A found friend stays as a little badge on its spot. */
  .friendBadge {
    position:absolute; top:-9px; right:-9px; width:32px; height:32px; z-index:4;
    border-radius:50%; border:3px solid #fff; overflow:hidden; pointer-events:none;
    box-shadow:0 3px 8px rgba(0,0,0,.3); background:#fff;
  }
  .friendBadge img { width:100%; height:100%; object-fit:cover; display:block; }
  /* The princess (big, gold) or a friend (smaller, white) popping out. */
  #peek {
    position:absolute; width:48%; aspect-ratio:1/1; border-radius:50%; overflow:hidden;
    border:5px solid #ffd94d; box-shadow:0 10px 24px rgba(91,42,134,.4);
    transform:translate(-50%,-50%) scale(0); pointer-events:none; z-index:5; background:#fff;
  }
  #peek.friend { width:38%; border-color:#fff; box-shadow:0 10px 24px rgba(46,125,50,.45); }
  #peek img { width:100%; height:100%; object-fit:cover; display:block; }
  #peek.show { animation:peekPop .55s cubic-bezier(.34,1.56,.64,1) forwards, peekWiggle 1s ease-in-out .55s infinite; }
  @keyframes peekPop {
    0% { transform:translate(-50%,-50%) scale(0); }
    70% { transform:translate(-50%,-50%) scale(1.12); }
    100% { transform:translate(-50%,-50%) scale(1); }
  }
  @keyframes peekWiggle {
    0%, 100% { transform:translate(-50%,-50%) rotate(-4deg); }
    50% { transform:translate(-50%,-50%) rotate(4deg); }
  }
  .puff {
    position:absolute; z-index:6; pointer-events:none; line-height:1;
    transform:translate(-50%,-50%);
  }
  /* Intro: she waves hello, then the sparkle flash hides her. */
  #intro {
    position:absolute; inset:0; z-index:8; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px;
    background:rgba(255,244,250,.45); opacity:0; pointer-events:none;
    transition:opacity .35s;
  }
  #intro.show { opacity:1; }
  #intro .stars { font-size:40px; letter-spacing:10px; animation:starFloat 1s ease-in-out infinite; }
  @keyframes starFloat { 0%, 100% { transform:translateY(0); } 50% { transform:translateY(-8px); } }
  #introPrincess {
    width:56%; aspect-ratio:1/1; border-radius:50%; overflow:hidden;
    border:6px solid #ffd94d; box-shadow:0 12px 28px rgba(91,42,134,.35); background:#fff;
    animation:introBounce .8s ease-in-out infinite;
  }
  #introPrincess img { width:100%; height:100%; object-fit:cover; display:block; }
  @keyframes introBounce { 0%, 100% { transform:translateY(0) scale(1); } 50% { transform:translateY(-10px) scale(1.03); } }
  /* Picture bar: flip between the three scenes. */
  #sceneBar {
    display:flex; justify-content:center; gap:14px;
    padding:4px 10px max(10px, env(safe-area-inset-bottom));
  }
  .sceneBtn {
    width:64px; height:64px; padding:0; cursor:pointer; overflow:hidden;
    position:relative;
    border-radius:18px; border:3px solid #fff; background:#fff;
    box-shadow:0 3px 0 rgba(124,58,237,.3), 0 6px 14px rgba(91,42,134,.15);
  }
  .sceneBtn img { width:100%; height:100%; object-fit:cover; display:block; pointer-events:none; }
  .sceneBtn.active { border-color:#ffd94d; transform:scale(1.08); }
  .sceneBtn.hintTab { animation:tabPulse .6s ease-in-out infinite; }
  .sceneBtn.hintTab::after {
    content:'✨'; position:absolute; top:1px; right:3px; z-index:2;
    font-size:28px; line-height:1; pointer-events:none;
    filter:drop-shadow(0 1px 2px rgba(0,0,0,.45));
    animation:hintBadgeBounce .5s ease-in-out infinite;
  }
  @keyframes hintBadgeBounce {
    0%, 100% { transform:translateY(0) scale(1); }
    50% { transform:translateY(-3px) scale(1.2); }
  }
  @keyframes tabPulse {
    0%, 100% { box-shadow:0 3px 0 rgba(124,58,237,.3), 0 0 0 3px rgba(255,217,77,.9); transform:scale(1.06); }
    50% { box-shadow:0 3px 0 rgba(124,58,237,.3), 0 0 0 10px rgba(255,217,77,0); transform:scale(1.14); }
  }
  /* Win overlay */
  #winOverlay {
    position:fixed; inset:0; z-index:20; display:none; flex-direction:column;
    align-items:center; justify-content:center; gap:16px; padding:24px;
    background:linear-gradient(180deg, rgba(255,233,246,.97), rgba(207,232,255,.97));
  }
  #winOverlay.show { display:flex; }
  #winOverlay .winPic {
    width:min(86vw, 430px); border-radius:24px; border:5px solid #fff;
    box-shadow:0 12px 30px rgba(91,42,134,.3); overflow:hidden;
  }
  #winOverlay .winPic img { width:100%; display:block; }
  #winOverlay .reward { font-size:clamp(26px, 7vw, 36px); font-weight:900; text-align:center; color:#7c3aed; }
  #againBtn {
    border:none; cursor:pointer; width:96px; height:96px; border-radius:50%;
    background:linear-gradient(160deg, #ffe27a, #f7c948); font-size:52px;
    box-shadow:0 6px 0 #c89100, 0 12px 24px rgba(91,42,134,.3);
    display:flex; align-items:center; justify-content:center;
  }
  #againBtn:active { transform:translateY(4px); box-shadow:0 2px 0 #c89100; }
  .confetti { position:fixed; top:-20px; z-index:30; border-radius:2px; pointer-events:none; }
</style>
</head>
<body>
<header>
  <div id="findBubble"><img id="findImg" src="assets/img/princess-01.jpg" alt=""><span class="badge">🔍</span></div>
  <div id="foundPill">⭐ <span id="foundNum">0</span></div>
  <button class="iconBtn" id="soundBtn" aria-label="sound"></button>
  <button class="iconBtn" id="newBtn" aria-label="new game"></button>
</header>
<div id="stage">
  <div id="sceneWrap">
    <img class="scene" id="sceneImg" src="assets/img/scene.jpg" alt="" draggable="false">
    <div id="peek"><img id="peekImg" src="assets/img/princess-01.jpg" alt=""></div>
    <div id="intro">
      <div class="stars">✨⭐✨</div>
      <div id="introPrincess"><img id="introImg" src="assets/img/princess-01.jpg" alt=""></div>
      <div class="stars">✨⭐✨</div>
    </div>
  </div>
</div>
<div id="sceneBar"></div>
<div id="winOverlay">
  <div class="winPic"><img src="assets/img/win.jpg" alt=""></div>
  <div class="reward">Good Job Emi! 💕 Dada</div>
  <button id="againBtn" aria-label="play again">⭐</button>
</div>
<script>
/* Hiding places: % of each picture (measured from the artwork).
   Forest list order is bottom-to-top paint order: small spots sitting
   on big ones come later so their taps win (see .spot comment). */
var SCENES = [
  { img:'scene.jpg', spots:[
    { id:'tower',    x:40.5, y:2.5,  w:17.5, h:37.5 },
    { id:'tree',     x:0,    y:16,   w:40,   h:27   },
    { id:'fountain', x:59,   y:29,   w:41,   h:19   },
    { id:'bush',     x:0,    y:45,   w:47,   h:17   },
    { id:'tent',     x:52,   y:49.5, w:46,   h:24.5 },
    { id:'cottage',  x:30,   y:80,   w:36,   h:17   }
  ]},
  { img:'castle.jpg', spots:[
    { id:'towerL',    x:4,    y:11.5, w:21,   h:18.5 },
    { id:'towerR',    x:75,   y:13,   w:22.5, h:17   },
    { id:'winRoundL', x:24.5, y:33.5, w:15.5, h:9    },
    { id:'winRoundC', x:41.5, y:33.5, w:17,   h:9    },
    { id:'winRoundR', x:60.5, y:33.5, w:16,   h:9    },
    { id:'winArchL',  x:24.5, y:48,   w:15,   h:11.5 },
    { id:'winArchC',  x:41.5, y:48,   w:17,   h:11.5 },
    { id:'winArchR',  x:60.5, y:48,   w:15,   h:11.5 },
    { id:'balcony',   x:20,   y:60,   w:60,   h:7.5  },
    { id:'door',      x:40.5, y:70.5, w:19.5, h:14.5 },
    { id:'lantern',   x:26,   y:69,   w:14,   h:9    },
    { id:'shield',    x:62,   y:69.5, w:15,   h:11.5 },
    { id:'ivy',       x:2,    y:30,   w:17,   h:51   },
    { id:'flowersL',  x:0,    y:81.5, w:32,   h:18   },
    { id:'flowersR',  x:69,   y:81.2, w:31,   h:18.3 }
  ]},
  { img:'forest.jpg', spots:[
    { id:'oak',           x:0,    y:0,    w:58,   h:70   },
    { id:'pineBack',      x:58,   y:14.3, w:18,   h:43.2 },
    { id:'pineRight',     x:72,   y:3,    w:28,   h:64   },
    { id:'flowersBL',     x:0,    y:85.5, w:46.5, h:14.5 },
    { id:'pond',          x:46.8, y:78.6, w:53.2, h:9.4  },
    { id:'flowersCenter', x:37.2, y:64,   w:22.2, h:6    },
    { id:'berryBush',     x:71.3, y:64.6, w:28.7, h:13.4 },
    { id:'mushrooms',     x:16,   y:62.5, w:16.5, h:8    },
    { id:'log',           x:14.7, y:70.5, w:35.9, h:8.2  },
    { id:'rock',          x:2,    y:79.5, w:25.2, h:7.5  },
    { id:'ferns',         x:58,   y:86.5, w:42,   h:13.5 },
    { id:'stump',         x:31.3, y:86.2, w:32,   h:7    },
    { id:'birdhouse',     x:18,   y:33,   w:13,   h:9.5  },
    { id:'beehive',       x:27,   y:41,   w:14,   h:11   },
    { id:'hollow',        x:10,   y:53.5, w:14.5, h:8.5  },
    { id:'lantern',       x:55.5, y:56,   w:12.5, h:11   }
  ]}
];
var PRINCESSES = ['princess-01.jpg', 'princess-04.jpg', 'princess-07.jpg', 'princess-09.jpg'];
var ANIMALS = [
  { img:'cat.jpg',      snd:'cat.mp3' },
  { img:'dog.jpg',      snd:'dog.mp3' },
  { img:'duck.jpg',     snd:'duck.mp3' },
  { img:'frog.jpg',     snd:'frog.mp3' },
  { img:'horse.jpg',    snd:'horse.mp3' },
  { img:'lion.jpg',     snd:'lion.mp3' },
  { img:'elephant.jpg', snd:'elephant.mp3' },
  { img:'monkey.jpg',   snd:'monkey.mp3' }
];
var SCENE_W = 1120, SCENE_H = 2240;

/* ---------- sounds ---------- */
var soundOn = true, found = 0;
try { soundOn = localStorage.getItem('hideSeekSound') !== '0'; } catch(e) {}
try { found = parseInt(localStorage.getItem('hideSeekFound') || '0', 10) || 0; } catch(e) {}
var AC = null;
function tone(freq, dur, type, delay, vol){
  if (!soundOn) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    var t = AC.currentTime + (delay || 0);
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.18, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(t); o.stop(t + dur + 0.05);
  } catch(e) {}
}
function sndPop(){ tone(520, .09, 'triangle', 0, .16); tone(760, .1, 'triangle', .05, .14); }
function sndBoop(){ tone(300, .13, 'sine', 0, .13); tone(210, .17, 'sine', .11, .12); }
function sndFound(){ [880, 1108, 1318, 1760].forEach(function(f, i){ tone(f, .18, 'sine', i * .09, .17); }); }
function sndHint(){ tone(1318, .15, 'sine', 0, .12); tone(1760, .2, 'sine', .12, .12); }
function sndWin(){ [523,659,784,1047,784,1047].forEach(function(f, i){ tone(f, .22, 'triangle', i * .13, .2); }); }
function playAnimal(aIdx){
  if (!soundOn) return;
  try {
    var a = new Audio('assets/snd/' + ANIMALS[aIdx].snd);
    var p = a.play();
    if (p && p.catch) p.catch(function(){});
  } catch(e) {}
}

/* ---------- icons ---------- */
function svgWrap(inner){ return '<svg viewBox="0 0 64 64">' + inner + '</svg>'; }
function speakerSVG(on){
  var waves = on
    ? '<path d="M40 24 Q46 32 40 40 M46 19 Q55 32 46 45" fill="none" stroke="#7c3aed" stroke-width="4" stroke-linecap="round"/>'
    : '<path d="M40 24 L52 40 M52 24 L40 40" fill="none" stroke="#e74c3c" stroke-width="4.5" stroke-linecap="round"/>';
  return svgWrap('<path d="M8 25 L18 25 L30 13 L30 51 L18 39 L8 39 Z" fill="#7c3aed"/>' + waves);
}
function refreshSVG(){
  return svgWrap('<path d="M54 32 A22 22 0 1 1 48 15" fill="none" stroke="#7c3aed" stroke-width="6" stroke-linecap="round"/>'
    + '<path d="M48 5 L53 18 L40 16 Z" fill="#7c3aed"/>');
}

/* ---------- layout: fit the tall picture to the screen ---------- */
var stageEl = document.getElementById('stage'),
    wrapEl = document.getElementById('sceneWrap');
function fitScene(){
  var aw = stageEl.clientWidth - 12, ah = stageEl.clientHeight - 8;
  if (!aw || !ah) return;
  var s = Math.min(aw / SCENE_W, ah / SCENE_H);
  wrapEl.style.width = Math.floor(SCENE_W * s) + 'px';
  wrapEl.style.height = Math.floor(SCENE_H * s) + 'px';
}
window.addEventListener('resize', fitScene);
window.addEventListener('orientationchange', function(){ setTimeout(fitScene, 60); });

/* ---------- state ---------- */
var sceneIdx = 0, hider = 0, lastHider = -1,
    hideScene = 0, hideSpot = 0, lastHideKey = '',
    surpriseMap = {}, tapped = {},
    locked = true, misses = 0, hintTimer = null, peekTimer = null;
var spotBtns = [], sceneBtns = [];
var peekEl = document.getElementById('peek'),
    peekImg = document.getElementById('peekImg'),
    introEl = document.getElementById('intro');

function spotKey(s, i){ return s + ':' + i; }
function shuffle(arr){
  for (var i = arr.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}

function renderFound(){ document.getElementById('foundNum').textContent = found; }
renderFound();
document.getElementById('soundBtn').innerHTML = speakerSVG(soundOn);
document.getElementById('newBtn').innerHTML = refreshSVG();

function buildSceneBar(){
  var bar = document.getElementById('sceneBar');
  bar.innerHTML = ''; sceneBtns = [];
  SCENES.forEach(function(sc, s){
    var b = document.createElement('button');
    b.className = 'sceneBtn'; b.setAttribute('aria-label', 'scene ' + (s + 1));
    b.innerHTML = '<img src="assets/img/' + sc.img + '" alt="" draggable="false">';
    b.addEventListener('click', function(){ sndPop(); showScene(s); });
    bar.appendChild(b);
    sceneBtns.push(b);
  });
}
buildSceneBar();

function showScene(s){
  sceneIdx = s;
  clearTimeout(peekTimer); peekTimer = null;
  peekEl.classList.remove('show', 'friend');
  document.getElementById('sceneImg').src = 'assets/img/' + SCENES[s].img;
  sceneBtns.forEach(function(b, i){ b.classList.toggle('active', i === s); });
  buildSpots();
}

function addFriendBadge(btn, aIdx){
  var badge = document.createElement('div');
  badge.className = 'friendBadge';
  badge.innerHTML = '<img src="assets/img/' + ANIMALS[aIdx].img + '" alt="">';
  btn.appendChild(badge);
}

function buildSpots(){
  spotBtns.forEach(function(b){ b.remove(); });
  spotBtns = [];
  SCENES[sceneIdx].spots.forEach(function(sp, i){
    var b = document.createElement('button');
    b.className = 'spot'; b.setAttribute('aria-label', sp.id);
    b.style.left = sp.x + '%'; b.style.top = sp.y + '%';
    b.style.width = sp.w + '%'; b.style.height = sp.h + '%';
    (function(s, idx, btn){ btn.addEventListener('click', function(){ onSpot(s, idx, btn); }); })(sceneIdx, i, b);
    var k = spotKey(sceneIdx, i);
    if (tapped[k] === 'empty') b.classList.add('checked');
    if (tapped[k] === 'friend' && surpriseMap[k] !== undefined) addFriendBadge(b, surpriseMap[k]);
    wrapEl.appendChild(b);
    spotBtns.push(b);
  });
}

function spotCenter(s, i){
  var sp = SCENES[s].spots[i];
  return { x: sp.x + sp.w / 2, y: sp.y + sp.h / 2 };
}
/* Keep the whole round portrait inside the picture. */
function clampPeek(c, sizePct){
  var halfX = sizePct / 2, halfY = halfX * (SCENE_W / SCENE_H);
  return {
    x: Math.min(100 - halfX, Math.max(halfX, c.x)),
    y: Math.min(100 - halfY, Math.max(halfY, c.y))
  };
}

function puff(xPct, yPct, char, size){
  var p = document.createElement('span');
  p.className = 'puff';
  p.textContent = char || '✨';
  p.style.left = xPct + '%'; p.style.top = yPct + '%';
  p.style.fontSize = (size || 30) + 'px';
  wrapEl.appendChild(p);
  var anim = p.animate(
    [{ transform:'translate(-50%,-50%) scale(.5)', opacity:1 },
     { transform:'translate(-50%,-140%) scale(1.2)', opacity:0 }],
    { duration:650, easing:'ease-out' });
  anim.onfinish = function(){ p.remove(); };
}

function burst(cx, cy, n){
  var W = wrapEl.clientWidth;
  for (var i = 0; i < (n || 12); i++){
    (function(i){
      var p = document.createElement('span');
      p.className = 'puff';
      p.textContent = (i % 3 === 0) ? '⭐' : '✨';
      p.style.left = cx + '%'; p.style.top = cy + '%';
      p.style.fontSize = (26 + Math.random() * 22) + 'px';
      wrapEl.appendChild(p);
      var ang = (i / (n || 12)) * Math.PI * 2 + Math.random() * .5;
      var dist = W * (0.14 + Math.random() * 0.14);
      var dx = Math.cos(ang) * dist, dy = Math.sin(ang) * dist;
      var anim = p.animate(
        [{ transform:'translate(-50%,-50%) scale(.4)', opacity:1 },
         { transform:'translate(calc(-50% + ' + dx.toFixed(1) + 'px), calc(-50% + ' + dy.toFixed(1) + 'px)) scale(1.15)', opacity:0 }],
        { duration:850 + Math.random() * 350, easing:'cubic-bezier(.2,.7,.3,1)' });
      anim.onfinish = function(){ p.remove(); };
    })(i);
  }
}

function ring(btn){
  btn.classList.remove('miss'); void btn.offsetWidth; btn.classList.add('miss');
}

function onSpot(s, i, btn){
  if (locked) return;
  var k = spotKey(s, i);
  if (s === hideScene && i === hideSpot){ foundHer(s, i); return; }
  if (surpriseMap[k] !== undefined){
    var first = !tapped[k];
    if (first){ tapped[k] = 'friend'; misses++; }
    showFriend(s, i, btn, surpriseMap[k], first);
    if (first && misses % 3 === 0) showHint();
    return;
  }
  if (tapped[k]){
    ring(btn);
    return;
  }
  tapped[k] = 'empty'; misses++;
  btn.classList.add('checked');
  sndBoop();
  ring(btn);
  var c = spotCenter(s, i);
  puff(c.x, c.y, '💨', 26);
  if (misses % 3 === 0) showHint();
}

function showFriend(s, i, btn, aIdx, first){
  sndPop();
  playAnimal(aIdx);
  var c = clampPeek(spotCenter(s, i), 38);
  peekImg.src = 'assets/img/' + ANIMALS[aIdx].img;
  peekEl.style.left = c.x + '%';
  peekEl.style.top = c.y + '%';
  peekEl.classList.remove('show'); void peekEl.offsetWidth;
  peekEl.classList.add('show', 'friend');
  burst(c.x, c.y, 7);
  clearTimeout(peekTimer);
  peekTimer = setTimeout(function(){
    peekEl.classList.remove('show', 'friend');
    if (first && btn.isConnected) addFriendBadge(btn, aIdx);
  }, 1300);
}

function showHint(){
  sndHint();
  clearTimeout(hintTimer);
  spotBtns.forEach(function(b){ b.classList.remove('hint'); });
  sceneBtns.forEach(function(b){ b.classList.remove('hintTab'); });
  if (hideScene !== sceneIdx){
    sceneBtns[hideScene].classList.add('hintTab');
    hintTimer = setTimeout(function(){
      sceneBtns[hideScene].classList.remove('hintTab');
    }, 3000);
  } else {
    var btn = spotBtns[hideSpot];
    if (!btn) return;
    btn.classList.add('hint');
    hintTimer = setTimeout(function(){ btn.classList.remove('hint'); }, 1500);
  }
}

function foundHer(s, i){
  locked = true;
  document.body.classList.remove('seeking');
  sndFound();
  var c = clampPeek(spotCenter(s, i), 48);
  peekImg.src = 'assets/img/' + PRINCESSES[hider];
  peekEl.style.left = c.x + '%';
  peekEl.style.top = c.y + '%';
  peekEl.classList.remove('show', 'friend'); void peekEl.offsetWidth;
  peekEl.classList.add('show');
  burst(c.x, c.y, 12);
  setTimeout(win, 1500);
}

function win(){
  found++;
  try { localStorage.setItem('hideSeekFound', String(found)); } catch(e) {}
  renderFound();
  sndWin();
  document.getElementById('winOverlay').classList.add('show');
  confetti();
}

function confetti(){
  var colors = ['#ffd94d','#ff8fb5','#4da6ff','#3fbf6f','#a06bff','#ff5a5a'];
  for (var i = 0; i < 42; i++){
    (function(i){
      var c = document.createElement('div');
      c.className = 'confetti';
      var size = 8 + Math.random() * 8;
      c.style.cssText = 'left:' + (Math.random()*100) + 'vw;width:' + size + 'px;height:' + (size*.6) + 'px;background:' + colors[i % colors.length] + ';';
      document.body.appendChild(c);
      var fall = c.animate(
        [{ transform:'translateY(0) rotate(0deg)', opacity:1 },
         { transform:'translateY(105vh) rotate(' + (360 + Math.random()*360) + 'deg)', opacity:.9 }],
        { duration: 1600 + Math.random()*1200, delay: Math.random()*500, easing:'cubic-bezier(.3,.6,.6,1)' });
      fall.onfinish = function(){ c.remove(); };
    })(i);
  }
}

function newGame(){
  do { hider = Math.floor(Math.random() * PRINCESSES.length); }
  while (PRINCESSES.length > 1 && hider === lastHider);
  lastHider = hider;
  /* Pick her hiding place (never the same one twice running). */
  var allKeys = [];
  SCENES.forEach(function(sc, s){
    sc.spots.forEach(function(sp, i){ allKeys.push(spotKey(s, i)); });
  });
  var hk;
  do { hk = allKeys[Math.floor(Math.random() * allKeys.length)]; }
  while (allKeys.length > 1 && hk === lastHideKey);
  lastHideKey = hk;
  var parts = hk.split(':');
  hideScene = parseInt(parts[0], 10); hideSpot = parseInt(parts[1], 10);
  /* 8 surprise friends on 8 other random spots. */
  surpriseMap = {};
  var rest = shuffle(allKeys.filter(function(k){ return k !== hk; }));
  var animals = shuffle(ANIMALS.map(function(a, idx){ return idx; }));
  for (var n = 0; n < ANIMALS.length && n < rest.length; n++){
    surpriseMap[rest[n]] = animals[n];
  }
  tapped = {}; misses = 0; locked = true;
  clearTimeout(hintTimer); hintTimer = null;
  clearTimeout(peekTimer); peekTimer = null;
  document.body.classList.remove('seeking');
  document.getElementById('winOverlay').classList.remove('show');
  peekEl.classList.remove('show', 'friend');
  var img = 'assets/img/' + PRINCESSES[hider];
  document.getElementById('findImg').src = img;
  document.getElementById('introImg').src = img;
  peekImg.src = img;
  showScene(0);
  /* She waves hello, then the sparkle flash hides her. */
  introEl.classList.add('show');
  sndPop();
  setTimeout(function(){
    introEl.classList.remove('show');
    burst(50, 50, 12);
    locked = false;
    document.body.classList.add('seeking');
  }, 1700);
}

document.getElementById('soundBtn').addEventListener('click', function(){
  soundOn = !soundOn;
  try { localStorage.setItem('hideSeekSound', soundOn ? '1' : '0'); } catch(e) {}
  this.innerHTML = speakerSVG(soundOn);
  if (soundOn) sndPop();
});
document.getElementById('newBtn').addEventListener('click', function(){ sndPop(); newGame(); });
document.getElementById('againBtn').addEventListener('click', function(){ sndPop(); newGame(); });

if ('serviceWorker' in navigator){
  navigator.serviceWorker.register('/kid-games/sw.js').catch(function(){});
}
fitScene();
newGame();
</script>
