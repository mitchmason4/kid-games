<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f9a8d4">
<link rel="apple-touch-icon" href="/kid-games/icon-maze.png">
<title>Emi's Fairy Maze 🧚</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overscroll-behavior:none; }
  body {
    font-family: ui-rounded, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(180deg, #aee3ff 0%, #d8f3ff 34%, #ffe9f6 72%, #e7ffd9 100%);
    display:flex; flex-direction:column; height:100dvh; overflow:hidden;
    user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
    color:#5b2a86;
  }
  header {
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    padding: max(10px, env(safe-area-inset-top)) 12px 8px;
  }
  h1 { font-size: clamp(20px, 4.5vw, 30px); font-weight:900; letter-spacing:.2px;
       color:#7c3aed; text-shadow:0 2px 0 #fff; margin-right:auto; }
  .btn {
    border:none; cursor:pointer; font-family:inherit; font-weight:800;
    font-size: clamp(15px, 3.4vw, 19px); color:#5b2a86;
    background:#fff; border-radius:999px; padding:10px 16px; min-height:48px;
    box-shadow:0 3px 0 rgba(124,58,237,.35), 0 6px 14px rgba(91,42,134,.12);
  }
  .btn:active { transform: translateY(2px); box-shadow:0 1px 0 rgba(124,58,237,.35); }
  .levels { display:flex; gap:6px; }
  .lvl { width:48px; height:48px; border-radius:50%; border:none; cursor:pointer;
    font-family:inherit; font-size:20px; font-weight:900; color:#7c3aed; background:#fff;
    box-shadow:0 3px 0 rgba(124,58,237,.35); }
  .lvl.on { background:#7c3aed; color:#fff; }
  #hint-line { text-align:center; font-size: clamp(14px, 3vw, 18px); font-weight:700;
    color:#9d5cff; padding:0 10px 6px; }
  #stage { flex:1; position:relative; min-height:0; }
  canvas#game { position:absolute; inset:0; width:100%; height:100%; touch-action:none; display:block; }

  /* ---------- win / reward overlay (same pattern as the other games) ---------- */
  #reward {
    position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center;
    background: rgba(46, 16, 84, .55); backdrop-filter: blur(3px); padding:18px;
  }
  #reward.hidden { display:none; }
  .reward-card { text-align:center; animation: pop-in .35s cubic-bezier(.2,1.6,.4,1); max-height:100%; }
  @keyframes pop-in { from { transform:scale(.6); opacity:0; } to { transform:scale(1); opacity:1; } }
  .reward-card img {
    max-width:min(92vw, 480px); max-height:62dvh; border-radius:24px;
    border:6px solid #fff; box-shadow:0 18px 50px rgba(0,0,0,.45); object-fit:cover;
  }
  .reward-text { font-size: clamp(26px, 6vw, 40px); font-weight:900; color:#fff; margin-top:14px;
    text-shadow:0 3px 10px rgba(0,0,0,.4); }
  .reward-sub { font-size: clamp(20px, 4.6vw, 28px); font-weight:800; color:#ffd7ef; margin-top:4px;
    text-shadow:0 2px 8px rgba(0,0,0,.4); }
  .reward-tap { font-size: clamp(15px, 3.6vw, 20px); color:#fff; margin-top:10px; opacity:.92; }
</style>
</head>
<body>
<header>
  <h1>🧚 Fairy Maze</h1>
  <div class="levels" id="levels">
    <button class="lvl" data-lvl="1">1</button>
    <button class="lvl" data-lvl="2">2</button>
    <button class="lvl" data-lvl="3">3</button>
  </div>
  <button class="btn" id="hintBtn">💡 Hint</button>
  <button class="btn" id="newBtn">🔀 New Maze</button>
  <button class="btn" id="soundBtn">🔊</button>
</header>
<div id="hint-line">Drag your finger to fly Emi through the maze to her unicorn! 🦄</div>
<div id="stage"><canvas id="game"></canvas></div>

<div id="reward" class="hidden">
  <div class="reward-card">
    <img id="rewardImg" src="assets/reward.jpg" alt="Emi the fairy hugging her unicorn">
    <div class="reward-text">You found your unicorn! 🦄</div>
    <div class="reward-sub">Good Job Emi! 💕 Dada</div>
    <div class="reward-tap">tap for a new maze 💖</div>
  </div>
</div>

<script>
(function(){
"use strict";
function $(id){ return document.getElementById(id); }

/* ---------- sound (same synth pattern as the other games) ---------- */
var AC = null;
function ac(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } } if(AC && AC.state==='suspended') AC.resume(); return AC; }
function tone(f0,f1,dur,type,vol,when){
  if(!soundOn) return;
  var a=ac(); if(!a) return;
  var t=a.currentTime+(when||0), o=a.createOscillator(), g=a.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f0,t);
  o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),t+dur);
  g.gain.setValueAtTime(vol||0.15,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur+0.02);
}
function pop(){ tone(520,940,0.1,'sine',0.16); }
function fanfare(){ var n=[523,659,784,1047,784,1047,1319]; for(var i=0;i<n.length;i++) tone(n[i],n[i],0.24,'triangle',0.14,i*0.11); }
var TWINKLE=[1047,1175,1319,1568,1760];
function twinkle(){ tone(TWINKLE[(Math.random()*TWINKLE.length)|0],0,0.18,'triangle',0.045); }

/* ---------- state ---------- */
/* ---------- maze varieties: shapes x sizes per level ---------- */
var LEVELS = {
 1:[ {shape:'rect',   cols:5, rows:7,  loops:0.20, name:'🌿 Garden Maze'},
     {shape:'round',  cols:7, rows:7,  loops:0.18, name:'🌸 Round Garden'},
     {shape:'heart',  cols:7, rows:8,  loops:0.18, name:'💖 Heart Maze'},
     {shape:'diamond',cols:7, rows:7,  loops:0.18, name:'💎 Diamond Maze'},
     {shape:'cross',  cols:7, rows:7,  loops:0.18, name:'✨ Crossroads Maze'} ],
 2:[ {shape:'rect',   cols:7, rows:10, loops:0.08, name:'🌿 Garden Maze'},
     {shape:'heart',  cols:8, rows:10, loops:0.08, name:'💖 Heart Maze'},
     {shape:'diamond',cols:9, rows:9,  loops:0.08, name:'💎 Diamond Maze'},
     {shape:'round',  cols:9, rows:9,  loops:0.08, name:'🌸 Round Garden'},
     {shape:'cross',  cols:9, rows:9,  loops:0.08, name:'✨ Crossroads Maze'},
     {shape:'rect',   cols:6, rows:12, loops:0.05, name:'🌀 Long Maze'} ],
 3:[ {shape:'rect',   cols:9, rows:13, loops:0.0, name:'🌿 Big Garden Maze'},
     {shape:'heart',  cols:10,rows:12, loops:0.0, name:'💖 Big Heart Maze'},
     {shape:'diamond',cols:11,rows:11, loops:0.0, name:'💎 Big Diamond Maze'},
     {shape:'round',  cols:11,rows:11, loops:0.0, name:'🌸 Big Round Garden'},
     {shape:'cross',  cols:11,rows:11, loops:0.0, name:'✨ Big Crossroads'},
     {shape:'rect',   cols:8, rows:14, loops:0.0, name:'🌀 Super Long Maze'} ]
};
var PALETTES = [
 { floor:'#fff8ec', alt:'rgba(255,183,213,0.10)', hedge:['#3e9c4f','#5cb85c','#7ed37e'],
   flowers:['#ff8fb2','#ffd54f','#ffffff','#e1a7ff'], startPad:'#ffb3d9', goalPad:'#b3e5ff' },
 { floor:'#fff3e2', alt:'rgba(255,170,80,0.13)', hedge:['#2e8b57','#43a96b','#6cc98a'],
   flowers:['#ff9e5e','#ff5d8f','#fff3b0','#ffffff'], startPad:'#ffc4a3', goalPad:'#a8e6ff' },
 { floor:'#fdf0ff', alt:'rgba(190,140,255,0.12)', hedge:['#3f9142','#5cab60','#86d186'],
   flowers:['#e1a7ff','#ff8fb2','#ffffff','#ffd54f'], startPad:'#e3b3ff', goalPad:'#b3ffd9' }
];
function inShape(shape,c,r){
  if(shape==='rect') return true;
  var u = cols>1 ? (c/(cols-1))*2-1 : 0;
  var v = rows>1 ? (r/(rows-1))*2-1 : 0;      /* v: -1 top, +1 bottom */
  if(shape==='round')   return u*u+v*v <= 1.12;
  if(shape==='diamond') return Math.abs(u)+Math.abs(v) <= 1.08;
  if(shape==='cross')   return Math.abs(u)<=0.44 || Math.abs(v)<=0.44;
  if(shape==='heart'){
    var x=u*1.04, y=-v*1.04;                   /* y up */
    var lobeL=(x+0.42)*(x+0.42)+(y-0.36)*(y-0.36) <= 0.34;
    var lobeR=(x-0.42)*(x-0.42)+(y-0.36)*(y-0.36) <= 0.34;
    var body = y<=0.40 && Math.abs(x) <= 0.99-(0.40-y)*0.56;
    var notch = y>0.55 && Math.abs(x)<0.30;    /* the dip between the lobes */
    return (lobeL||lobeR||body) && !notch;
  }
  return true;
}
/* where the fairy starts for each shape (normalized u,v target) */
var START_TARGET = { rect:[-1,-1], round:[-0.72,-0.72], heart:[0,-0.85],
                     diamond:[0,-1], cross:[0,-1] };
var level = parseInt(localStorage.getItem('fairyMazeLevel')||'1',10);
if(!LEVELS[level]) level = 1;
var soundOn = localStorage.getItem('fairyMazeSound') !== 'off';

var stage = $('stage'), canvas = $('game'), ctx = canvas.getContext('2d');
var DPR = Math.min(window.devicePixelRatio||1, 2);

/* maze model: cells[c][r] = {n,e,s,w} walls, all coords below in GRID units */
var cols=0, rows=0, cells=null, mask=null, solution=[], seed=1;
var startCell=[0,0], goalCell=[0,0], combo=null, lastCombo=null, pal=PALETTES[0];
var fairy = { x:0.5, y:0.5 };            /* grid units */
var FAIRY_R = 0.21, WALL_HALF = 0.15;    /* grid units */
var dragging=false, pointer=null, won=false;
var sparkles=[], bursts=[];
var hintUntil=0, lastTwinkle=0, tNow=0;

/* layout (pixels) */
var cellPx=40, ox=0, oy=0, mazeW=0, mazeH=0;
var mazeCanvas = document.createElement('canvas');

var fairyImg = new Image(); fairyImg.src='assets/fairy.png';
var unicornImg = new Image(); unicornImg.src='assets/unicorn.png';

/* ---------- seeded rng for wall flowers ---------- */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; var t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

/* ---------- maze generation: backtracker over the shape's cells.
   The unicorn always waits at the cell FARTHEST from the start,
   so every maze is as long as its shape allows. ---------- */
function genMaze(){
  var pool=LEVELS[level];
  var pick=(Math.random()*pool.length)|0;
  if(pool.length>1 && pool[pick]===lastCombo) pick=(pick+1)%pool.length;
  combo=pool[pick]; lastCombo=combo;
  cols=combo.cols; rows=combo.rows;
  pal=PALETTES[(Math.random()*PALETTES.length)|0];
  var straightBias = Math.random()<0.5;   /* long corridors vs twisty turns */
  cells=[]; mask=[]; var c,r;
  for(c=0;c<cols;c++){ cells.push([]); mask.push([]);
    for(r=0;r<rows;r++){ var inside=inShape(combo.shape,c,r);
      mask[c].push(inside);
      cells[c].push({n:1,e:1,s:1,w:1,seen:inside?0:1}); } }
  /* start: the in-shape cell nearest the shape's start target */
  var tgt=START_TARGET[combo.shape]||[-1,-1], best=1e9;
  for(c=0;c<cols;c++) for(r=0;r<rows;r++){ if(!mask[c][r]) continue;
    var u=cols>1?(c/(cols-1))*2-1:0, v=rows>1?(r/(rows-1))*2-1:0;
    var dd=(u-tgt[0])*(u-tgt[0])+(v-tgt[1])*(v-tgt[1]);
    if(dd<best){ best=dd; startCell=[c,r]; } }
  var DIRS=[[0,-1,'n','s'],[1,0,'e','w'],[0,1,'s','n'],[-1,0,'w','e']];
  var stack=[startCell]; cells[startCell[0]][startCell[1]].seen=1;
  while(stack.length){
    var cur=stack[stack.length-1], cx=cur[0], cy=cur[1], opts=[];
    for(var i=0;i<4;i++){ var nx=cx+DIRS[i][0], ny=cy+DIRS[i][1];
      if(nx>=0&&ny>=0&&nx<cols&&ny<rows&&mask[nx][ny]&&!cells[nx][ny].seen) opts.push(DIRS[i]); }
    if(!opts.length){ stack.pop(); continue; }
    var d=null;
    if(straightBias && stack.length>1){
      var px=stack[stack.length-2][0], py=stack[stack.length-2][1];
      for(var j=0;j<opts.length;j++)
        if(cx-px===opts[j][0] && cy-py===opts[j][1] && Math.random()<0.6) d=opts[j];
    }
    if(!d) d=opts[(Math.random()*opts.length)|0];
    var mx=cx+d[0], my=cy+d[1];
    cells[cx][cy][d[2]]=0; cells[mx][my][d[3]]=0; cells[mx][my].seen=1;
    stack.push([mx,my]);
  }
  /* safety net: stitch in any in-shape cell the carve could not reach */
  var changed=true;
  while(changed){ changed=false;
    for(c=0;c<cols;c++) for(r=0;r<rows;r++){
      if(!mask[c][r]||cells[c][r].seen) continue;
      for(var i2=0;i2<4;i2++){ var ax=c+DIRS[i2][0], ay=r+DIRS[i2][1];
        if(ax>=0&&ay>=0&&ax<cols&&ay<rows&&mask[ax][ay]&&cells[ax][ay].seen){
          cells[c][r][DIRS[i2][2]]=0; cells[ax][ay][DIRS[i2][3]]=0;
          cells[c][r].seen=1; changed=true; break; } }
    }
  }
  /* knock down a few extra walls to make loops (gentler for little kids) */
  var extra=Math.floor(cols*rows*combo.loops), guard=0;
  while(extra>0 && guard++<600){
    var x=(Math.random()*cols)|0, y=(Math.random()*rows)|0;
    if(!mask[x][y]) continue;
    if(Math.random()<0.5){ if(x+1<cols&&mask[x+1][y]&&cells[x][y].e){ cells[x][y].e=0; cells[x+1][y].w=0; extra--; } }
    else { if(y+1<rows&&mask[x][y+1]&&cells[x][y].s){ cells[x][y].s=0; cells[x][y+1].n=0; extra--; } }
  }
  /* BFS distances from the start; the unicorn takes the farthest cell */
  var key=function(c2,r2){ return c2+','+r2; };
  var prev={}, dist={}, q=[startCell];
  dist[key(startCell[0],startCell[1])]=0;
  while(q.length){
    var cur2=q.shift(), cx2=cur2[0], cy2=cur2[1], cell=cells[cx2][cy2], nb=[];
    if(!cell.n) nb.push([cx2,cy2-1]); if(!cell.s) nb.push([cx2,cy2+1]);
    if(!cell.w) nb.push([cx2-1,cy2]); if(!cell.e) nb.push([cx2+1,cy2]);
    for(var i3=0;i3<nb.length;i3++){ var k2=key(nb[i3][0],nb[i3][1]);
      if(dist[k2]===undefined){ dist[k2]=dist[key(cx2,cy2)]+1; prev[k2]=cur2; q.push(nb[i3]); } }
  }
  var far=-1; goalCell=startCell;
  for(c=0;c<cols;c++) for(r=0;r<rows;r++){ var kk=key(c,r);
    if(mask[c][r]&&dist[kk]!==undefined&&dist[kk]>far){ far=dist[kk]; goalCell=[c,r]; } }
  solution=[]; var cur3=goalCell;
  while(cur3){ solution.push(cur3);
    if(cur3[0]===startCell[0]&&cur3[1]===startCell[1]) break;
    cur3=prev[key(cur3[0],cur3[1])]; }
  solution.reverse();
  seed = (Math.random()*1e9)|0;
  fairy.x=startCell[0]+0.5; fairy.y=startCell[1]+0.5; won=false; sparkles.length=0;
}

/* ---------- wall segments (grid units) ---------- */
function wallSegments(){
  var segs=[], seenSeg={}, c, r, cell;
  function push(a,b,cc,d){ var k=a+','+b+'-'+cc+','+d;
    if(seenSeg[k]) return; seenSeg[k]=1; segs.push([a,b,cc,d]); }
  for(c=0;c<cols;c++) for(r=0;r<rows;r++){ if(!mask[c][r]) continue; cell=cells[c][r];
    if(cell.n) push(c,r,c+1,r);
    if(cell.s) push(c,r+1,c+1,r+1);
    if(cell.w) push(c,r,c,r+1);
    if(cell.e) push(c+1,r,c+1,r+1);
  }
  return segs;
}
var segs=[];
function distToSeg(px,py,s){
  var dx=s[2]-s[0], dy=s[3]-s[1], L2=dx*dx+dy*dy;
  var t = L2? ((px-s[0])*dx+(py-s[1])*dy)/L2 : 0;
  t=Math.max(0,Math.min(1,t));
  var ex=s[0]+t*dx-px, ey=s[1]+t*dy-py;
  return Math.sqrt(ex*ex+ey*ey);
}
function collides(x,y){
  /* only segments near the point can matter */
  for(var i=0;i<segs.length;i++){
    var s=segs[i];
    if(Math.max(s[0],s[2])<x-0.5||Math.min(s[0],s[2])>x+0.5) continue;
    if(Math.max(s[1],s[3])<y-0.5||Math.min(s[1],s[3])>y+0.5) continue;
    if(distToSeg(x,y,s) < FAIRY_R+WALL_HALF) return true;
  }
  return false;
}

/* ---------- layout + maze pre-render ---------- */
function layout(){
  var w=stage.clientWidth, h=stage.clientHeight;
  canvas.width=w*DPR; canvas.height=h*DPR;
  cellPx=Math.max(24, Math.floor(Math.min(w/cols, h/rows)));
  mazeW=cellPx*cols; mazeH=cellPx*rows;
  ox=Math.round((w-mazeW)/2); oy=Math.round((h-mazeH)/2);
  renderMaze();
}
function renderMaze(){
  mazeCanvas.width=mazeW*DPR; mazeCanvas.height=mazeH*DPR;
  var m=mazeCanvas.getContext('2d'); m.scale(DPR,DPR);
  var rnd=mulberry32(seed);
  /* floor: only the cells inside the shape */
  for(var c=0;c<cols;c++) for(var r=0;r<rows;r++){ if(!mask[c][r]) continue;
    m.fillStyle=pal.floor; m.fillRect(c*cellPx,r*cellPx,cellPx,cellPx);
    if((c+r)%2===0){ m.fillStyle=pal.alt; m.fillRect(c*cellPx,r*cellPx,cellPx,cellPx); } }
  /* start pad */
  pad(m, (startCell[0]+0.5)*cellPx, (startCell[1]+0.5)*cellPx, pal.startPad);
  /* goal pad */
  pad(m, (goalCell[0]+0.5)*cellPx, (goalCell[1]+0.5)*cellPx, pal.goalPad);
  /* hedges */
  m.lineCap='round';
  for(var i=0;i<segs.length;i++){ var s=segs[i];
    var x1=s[0]*cellPx, y1=s[1]*cellPx, x2=s[2]*cellPx, y2=s[3]*cellPx;
    m.strokeStyle=pal.hedge[0]; m.lineWidth=cellPx*0.30;
    m.beginPath(); m.moveTo(x1,y1); m.lineTo(x2,y2); m.stroke();
    m.strokeStyle=pal.hedge[1]; m.lineWidth=cellPx*0.19;
    m.beginPath(); m.moveTo(x1,y1); m.lineTo(x2,y2); m.stroke();
    m.strokeStyle=pal.hedge[2]; m.lineWidth=cellPx*0.07;
    m.beginPath(); m.moveTo(x1,y1); m.lineTo(x2,y2); m.stroke();
    /* flowers on the hedge */
    if(rnd()<0.55){
      var n=1+((rnd()*2)|0);
      for(var f=0;f<n;f++){ var t=0.2+rnd()*0.6;
        m.fillStyle=pal.flowers[(rnd()*pal.flowers.length)|0];
        m.beginPath(); m.arc(x1+(x2-x1)*t, y1+(y2-y1)*t, Math.max(2,cellPx*0.05), 0, 7); m.fill(); }
    }
  }
}
function pad(m,x,y,color){
  var g=m.createRadialGradient(x,y,2,x,y,cellPx*0.62);
  g.addColorStop(0,color); g.addColorStop(1,'rgba(255,255,255,0)');
  m.fillStyle=g; m.beginPath(); m.arc(x,y,cellPx*0.62,0,7); m.fill();
}

/* ---------- particles ---------- */
function addSparkle(x,y,burst){
  sparkles.push({ x:x, y:y,
    vx:(Math.random()-0.5)*(burst?2.4:0.5), vy:(Math.random()-0.7)*(burst?2.4:0.5),
    life:0, max: burst? 900+Math.random()*600 : 500+Math.random()*400,
    size:(burst?0.10:0.07)+Math.random()*0.06,
    hue:[45,320,190,280][(Math.random()*4)|0] });
  if(sparkles.length>240) sparkles.splice(0, sparkles.length-240);
}
function drawStar(x,y,r,rot,color,alpha){
  ctx.save(); ctx.translate(x,y); ctx.rotate(rot); ctx.globalAlpha=alpha; ctx.fillStyle=color;
  ctx.beginPath();
  for(var i=0;i<8;i++){ var ang=i*Math.PI/4, rad=i%2? r*0.38 : r;
    ctx.lineTo(Math.cos(ang)*rad, Math.sin(ang)*rad); }
  ctx.closePath(); ctx.fill(); ctx.restore();
}

/* move the fairy toward the finger for dt milliseconds of travel.
   Called every frame while dragging AND directly on pointermove,
   so even a quick flick registers. */
function stepFairy(dt){
  if(!pointer || won) return;
  var dx=pointer.x-fairy.x, dy=pointer.y-fairy.y;
  var dist=Math.sqrt(dx*dx+dy*dy);
  if(dist<=0.02) return;
  var speed=3.4*(dt/1000), steps=Math.max(1, Math.ceil(dist/(FAIRY_R*0.4)));
  for(var i=0;i<steps;i++){
    var ddx=pointer.x-fairy.x, ddy=pointer.y-fairy.y, dd=Math.sqrt(ddx*ddx+ddy*ddy);
    if(dd<0.01) break;
    var step=Math.min(speed/steps, dd);
    var nx=fairy.x+ddx/dd*step, ny=fairy.y+ddy/dd*step;
    if(!collides(nx,ny)){ fairy.x=nx; fairy.y=ny; }
    else if(!collides(nx,fairy.y)){ fairy.x=nx; }
    else if(!collides(fairy.x,ny)){ fairy.y=ny; }
    else break;
  }
  if(Math.random()<0.75) addSparkle(fairy.x, fairy.y+0.15, false);
  var now=performance.now();
  if(now-lastTwinkle>320){ lastTwinkle=now; twinkle(); }
  /* reached the unicorn? */
  var gx=goalCell[0]+0.5, gy=goalCell[1]+0.5, ux=fairy.x-gx, uy=fairy.y-gy;
  if(Math.sqrt(ux*ux+uy*uy)<0.55) win();
}

/* ---------- main loop ---------- */
var lastT=0;
function loop(ts){
  requestAnimationFrame(loop);
  var dt=Math.min(50, ts-(lastT||ts)); lastT=ts; tNow=ts;

  if(dragging) stepFairy(dt);

  /* draw */
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(mazeCanvas, ox, oy, mazeW, mazeH);

  /* hint path */
  if(ts<hintUntil && solution.length){
    ctx.save();
    ctx.globalAlpha=Math.max(0, Math.min(0.85, (hintUntil-ts)/900));
    ctx.strokeStyle='#ffcf3f'; ctx.lineWidth=Math.max(3,cellPx*0.10);
    ctx.lineCap='round'; ctx.lineJoin='round'; ctx.setLineDash([2, cellPx*0.32]);
    ctx.beginPath();
    for(var i=0;i<solution.length;i++){
      var px=ox+(solution[i][0]+0.5)*cellPx, py=oy+(solution[i][1]+0.5)*cellPx;
      if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
    }
    ctx.stroke(); ctx.restore();
  }

  /* unicorn at the goal (gentle bob) */
  var bobU=Math.sin(ts/420)*cellPx*0.03;
  if(unicornImg.complete && unicornImg.naturalWidth){
    var uw=cellPx*1.18, uh=uw*unicornImg.naturalHeight/unicornImg.naturalWidth;
    ctx.drawImage(unicornImg, ox+(goalCell[0]+0.5)*cellPx-uw/2, oy+(goalCell[1]+0.5)*cellPx-uh/2+bobU, uw, uh);
  } else {
    ctx.font=cellPx+'px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('🦄', ox+(goalCell[0]+0.5)*cellPx, oy+(goalCell[1]+0.5)*cellPx+bobU);
  }

  /* sparkles */
  for(var j=sparkles.length-1;j>=0;j--){ var p=sparkles[j];
    p.life+=dt; if(p.life>=p.max){ sparkles.splice(j,1); continue; }
    p.x+=p.vx*(dt/1000); p.y+=p.vy*(dt/1000);
    var a=1-p.life/p.max;
    drawStar(ox+p.x*cellPx, oy+p.y*cellPx, p.size*cellPx, p.life/300, 'hsl('+p.hue+',95%,72%)', a);
  }

  /* fairy (flutter + bob + lean toward motion) */
  var fx=ox+fairy.x*cellPx, fy=oy+fairy.y*cellPx + Math.sin(ts/260)*cellPx*0.045;
  ctx.save();
  ctx.fillStyle='rgba(90,40,140,0.18)';
  ctx.beginPath(); ctx.ellipse(fx, oy+fairy.y*cellPx+cellPx*0.34, cellPx*0.26, cellPx*0.09, 0, 0, 7); ctx.fill();
  ctx.restore();
  if(fairyImg.complete && fairyImg.naturalWidth){
    var fw=cellPx*0.98, fh=fw*fairyImg.naturalHeight/fairyImg.naturalWidth;
    var flutter=1+Math.sin(ts/90)*0.012;
    ctx.save(); ctx.translate(fx,fy); ctx.scale(1,flutter);
    ctx.drawImage(fairyImg, -fw/2, -fh/2, fw, fh);
    ctx.restore();
  } else {
    ctx.font=cellPx*0.9+'px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('🧚', fx, fy);
  }
}

/* ---------- win ---------- */
var confettiCv=null;
function launchConfetti(){
  var c=document.createElement('canvas');
  c.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:60';
  c.width=innerWidth; c.height=innerHeight; document.body.appendChild(c);
  var x=c.getContext('2d'), P=[], cols2=['#ff5d8f','#ffb340','#5dc9ff','#8dff57','#c77dff'];
  for(var i=0;i<110;i++) P.push({x:Math.random()*c.width, y:-20-Math.random()*c.height*0.4,
    w:6+Math.random()*7, h:8+Math.random()*10, vy:2.2+Math.random()*2.6, ph:Math.random()*7, c:cols2[i%5]});
  var t0=performance.now();
  (function tick(now){
    var el=(now-t0)/1000;
    x.clearRect(0,0,c.width,c.height);
    for(var i=0;i<P.length;i++){ var p=P[i];
      p.y+=p.vy; p.ph+=0.08;
      x.save(); x.translate(p.x+Math.sin(p.ph)*20, p.y); x.rotate(p.ph);
      x.fillStyle=p.c; x.fillRect(-p.w/2,-p.h/2,p.w,p.h); x.restore();
    }
    if(el<3.2) requestAnimationFrame(tick); else c.remove();
  })(t0);
}
function win(){
  won=true; dragging=false;
  for(var i=0;i<40;i++) addSparkle(fairy.x, fairy.y, true);
  fanfare(); launchConfetti();
  setTimeout(function(){ $('reward').classList.remove('hidden'); launchConfetti(); }, 650);
}
$('reward').addEventListener('pointerdown', function(e){
  $('reward').classList.add('hidden'); e.stopPropagation(); pop(); newMaze();
});

/* ---------- pointer: the finger draws the path, the fairy follows ---------- */
function toGrid(ev){
  var r=canvas.getBoundingClientRect();
  return { x:(ev.clientX-r.left-ox)/cellPx, y:(ev.clientY-r.top-oy)/cellPx };
}
canvas.addEventListener('pointerdown', function(ev){
  ev.preventDefault(); ac();
  canvas.setPointerCapture(ev.pointerId);
  dragging=true; pointer=toGrid(ev);
});
canvas.addEventListener('pointermove', function(ev){
  if(dragging){ pointer=toGrid(ev); stepFairy(50); }
});
function endDrag(){ dragging=false; pointer=null; }
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);
canvas.addEventListener('contextmenu', function(e){ e.preventDefault(); });

/* ---------- controls ---------- */
function newMaze(){ genMaze(); segs=wallSegments(); layout(); flashName(); }
var nameTimer=null;
function flashName(){
  if(!combo) return;
  var el=$('hint-line');
  el.textContent=combo.name+' — find the unicorn! 🦄';
  if(nameTimer) clearTimeout(nameTimer);
  nameTimer=setTimeout(function(){
    el.textContent='Drag your finger to fly Emi through the maze to her unicorn! 🦄';
  }, 3000);
}
$('newBtn').addEventListener('click', function(){ pop(); newMaze(); });
$('hintBtn').addEventListener('click', function(){ pop(); hintUntil=performance.now()+4000; });
$('soundBtn').addEventListener('click', function(){
  soundOn=!soundOn; localStorage.setItem('fairyMazeSound', soundOn?'on':'off');
  $('soundBtn').textContent=soundOn?'🔊':'🔇'; if(soundOn) pop();
});
var lvlBtns=document.querySelectorAll('.lvl');
function paintLevels(){ for(var i=0;i<lvlBtns.length;i++)
  lvlBtns[i].classList.toggle('on', parseInt(lvlBtns[i].dataset.lvl,10)===level); }
for(var i=0;i<lvlBtns.length;i++) lvlBtns[i].addEventListener('click', function(){
  level=parseInt(this.dataset.lvl,10); localStorage.setItem('fairyMazeLevel', String(level));
  paintLevels(); pop(); newMaze();
});

/* ---------- init ---------- */
$('soundBtn').textContent=soundOn?'🔊':'🔇';
paintLevels();
newMaze();
window.addEventListener('resize', layout);
/* re-fit whenever the stage changes size (e.g. the maze-name line wraps,
   fonts load) so tall mazes never spill past the bottom edge */
if (window.ResizeObserver) new ResizeObserver(function(){ layout(); }).observe(stage);
window.addEventListener('load', layout);
fairyImg.onload=function(){};
requestAnimationFrame(loop);

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('/kid-games/sw.js', { scope: '/kid-games/' });
  });
}
})();
</script>
